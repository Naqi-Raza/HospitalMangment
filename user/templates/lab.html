{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Appointment Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Lab Appointment Form</h2>
    <div class="card shadow p-4">
        <form method="POST" action="{% url 'lab_appointment' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="patient_name" class="form-label">Patient Name</label>
                <input type="text" class="form-control" id="patient_name" name="patient_name" required>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
            </div>

            <div class="mb-3">
                <label for="cell_no" class="form-label">Cell Number</label>
                <input type="tel" class="form-control" id="cell_no" name="cell_no" placeholder="03XXXXXXXXX" required>
            </div>

            <div class="mb-3">
                <label for="test_name" class="form-label">Test Name</label>
                <input type="text" class="form-control" id="test_name" name="test_name" value="{{test_name}}" readonly>
            </div>

            <button type="submit" class="btn btn-primary w-100">Book Appointment</button>
        </form>
    </div>
</div>
</body>
</html>
