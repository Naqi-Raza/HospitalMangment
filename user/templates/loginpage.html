{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/loginpage.css' %}">
</head>
<body>

  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="row shadow-lg rounded-4 overflow-hidden w-75 bg-white">

      <!-- Left Section -->
      <div class="col-md-6 p-0">
        <div class="left-section h-100">
          <img src="static/images/loginpic.jpg" 
               alt="Doctor" class="img-fluid h-50 w-100 object-fit-cover">
          <div class="blue-section p-5 text-white">
            <h4 class="fw-bold mb-3">Welcome to <span class="text-light">CareWell</span></h4>
            <h5 class="fw-semibold mb-3">Hospital Management System</h5>
            <p>Cloud Based Streamlined Hospital Management System<br>
               with a centralized, user-friendly platform.</p>
          </div>
        </div>
      </div>

      <!-- Right Section -->
      <div class="col-md-6 p-5 d-flex flex-column justify-content-center">
        <div class="text-center mb-4">
          
          <h3 class="fw-bold mt-3">CareWell</h3>
        </div>
        <h4 class="fw-bold mb-2">Login</h4>
        <p class="text-muted mb-4">Enter your credentials to log in to your account</p>

        <form>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="example@gmail.com">
          </div>
          <div class="mb-3 position-relative">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="********">
            <a href="#" class="text-decoration-none small position-absolute end-0 top-0 mt-2 me-2">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-3 py-2">Login In</button>
        </form>

        <p class="text-center mt-4 mb-0">
          Don’t have an account? <a href="#" class="text-decoration-none fw-semibold">Sign Up</a>
        </p>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
